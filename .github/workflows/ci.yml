name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @osemka/desktop ensure:electron
      - run: pnpm --filter @osemka/desktop rebuild:native
      - run: pnpm typecheck
      - run: pnpm test
      - name: Smoke test (opens the app, checks SQLite and restart)
        run: pnpm smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ matrix.os }}
          path: apps/desktop/out/smoke/*.png
          if-no-files-found: ignore

  # Builds the installer and launches the packaged app twice (SQLite, content, restart). CI has no recordings
  # (they are not in git), so listening shows "nagranie niedostępne" here; release builds are made locally.
  package:
    name: package-${{ matrix.os }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            dist: dist:win
            exe: release/win-unpacked/Osemka.exe
          - os: macos-latest
            dist: "dist:mac --arm64"
            exe: release/mac-arm64/Osemka.app/Contents/MacOS/Osemka
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @osemka/desktop ensure:electron
      # Signing turns on only when these secrets exist (see docs/code-signing.md); without them the build is unsigned.
      - run: pnpm --filter @osemka/desktop ${{ matrix.dist }}
        env:
          CSC_LINK: ${{ matrix.os == 'macos-latest' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          OSEMKA_AZURE_ENDPOINT: ${{ vars.OSEMKA_AZURE_ENDPOINT }}
          OSEMKA_AZURE_ACCOUNT: ${{ vars.OSEMKA_AZURE_ACCOUNT }}
          OSEMKA_AZURE_PROFILE: ${{ vars.OSEMKA_AZURE_PROFILE }}
          OSEMKA_AZURE_PUBLISHER: ${{ vars.OSEMKA_AZURE_PUBLISHER }}
      - name: Smoke test of the packaged app
        working-directory: apps/desktop
        shell: bash
        run: OSEMKA_SMOKE_EXE="${{ matrix.exe }}" pnpm smoke:packaged
      # Test builds without recordings: the English listening tasks say the recording is not installed.
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}-no-recordings
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
          if-no-files-found: error
          retention-days: 14
